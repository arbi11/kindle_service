name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Test Pi reading agent
        working-directory: agent
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Install FFmpeg
        timeout-minutes: 4
        run: |
          if command -v ffmpeg && command -v ffprobe; then
            exit 0
          fi
          # Avoid slow regional mirrors and unnecessary GPU/desktop packages.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt > /dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate reviewed connection catalogue
        run: python -m connection_sdk
